[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single Page Application (SPA) routing:
# Ensures routes like /room/WCD-1234, /room/WCD-1234/worker, and /room/WCD-1234/customer
# are served by index.html instead of returning 404 on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
